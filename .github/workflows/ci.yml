name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - name: langdoctor scans itself
        run: python -m langdoctor .

  # Runs action.yml from this checkout, the way `uses: elaz48/langdoctor@<sha>`
  # would, on every OS a user's workflow can run on.
  action:
    name: action · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Scan the vulnerable example through the action
        uses: ./
        with:
          path: examples/vulnerable-agent
          fail-on: never
          args: --ignore LD302,LD303
      - name: The SARIF report lists the findings
        shell: bash
        run: |
          python -c "import json; r = json.load(open('langdoctor.sarif', encoding='utf-8'))['runs'][0]; ids = {x['ruleId'] for x in r['results']}; assert 'LD106' in ids and not ids & {'LD302', 'LD303'}, ids; print(len(r['results']), 'findings,', r['properties']['suppressed'], 'suppressed')"

  test:
    name: py${{ matrix.python-version }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: pytest -q
