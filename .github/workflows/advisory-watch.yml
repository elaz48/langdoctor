name: Advisory watch

# Weekly delta check: does OSV know about any advisory for our packages that
# advisories.json doesn't cover and we haven't already tracked? Out-of-scope
# advisories (scripts/watch-ignore.json) are never alerted; everything else is
# tracked in .watch-state.json so it alerts once, not every week.

on:
  schedule:
    - cron: "0 6 * * 1"   # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write   # commit the updated .watch-state.json
  issues: write     # open / comment the tracking issue

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .

      - name: Query OSV and diff against advisories.json
        id: watch
        run: python scripts/advisory_watch.py   # always exits 0

      - name: Report newly-uncovered advisories
        if: steps.watch.outputs.new_count != '' && steps.watch.outputs.new_count != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Reuse the open tracking issue if there is one; otherwise open a new one.
          existing=$(gh issue list --label advisory-watch --state open --json number --jq '.[0].number // ""')
          if [ -n "$existing" ]; then
            echo "Appending to open issue #$existing"
            gh issue comment "$existing" --body-file advisory-report.md
          else
            gh label create advisory-watch --color FF5F56 \
              --description "Uncovered LangChain/LangGraph/Langflow advisories" 2>/dev/null || true
            gh issue create \
              --title "Advisory watch: new uncovered advisories ($(date -u +%F))" \
              --label advisory-watch \
              --body-file advisory-report.md
          fi

      - name: Commit updated watch state
        run: |
          set -euo pipefail
          if git diff --quiet -- .watch-state.json; then
            echo "watch state unchanged"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add .watch-state.json
            git commit -m "chore: update advisory watch state [skip ci]"
            git push
          fi
